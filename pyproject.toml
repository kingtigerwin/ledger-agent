[project]
name = "ledger-agent"
version = "0.1.0"
description = "Turns a customer's free text into ledger-api transactions with Claude, over MCP"
requires-python = ">=3.13"
dependencies = [
    "anthropic>=2.3.0",
    "boto3>=1.43.119",
    "mcp>=2.3.0",
    "pydantic>=2.14.1",
    "tzdata>=2026.5",
]

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "boto3-stubs[dynamodb,ssm]>=1.43.119",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.1",
    "ruff>=0.17.3",
]
infra = [
    "aws-cdk-lib>=2.275.0",
    "constructs>=10.8.1",
]

[tool.uv]
default-groups = ["dev", "infra"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.pyright]
include = ["src", "tests", "infra", "scripts"]
pythonVersion = "3.13"
typeCheckingMode = "strict"
